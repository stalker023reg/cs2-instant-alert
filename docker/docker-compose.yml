# ════════════════════════════════════════════════════════════════
# CS2 Instant Alert — Docker Compose
# Full stack: App + PostgreSQL + Redis
# ════════════════════════════════════════════════════════════════

services:
  # ─── Application ───
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cs2-alert-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      REDIS_HOST: redis
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
    networks:
      - cs2-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: cs2-alert-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cs2_alert}
      POSTGRES_USER: ${DATABASE_USER:-cs2_alert}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cs2-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-cs2_alert} -d ${DATABASE_NAME:-cs2_alert}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: cs2-alert-redis
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - >-
        test -n "$${REDIS_PASSWORD}" || { echo 'REDIS_PASSWORD must be set' >&2; exit 1; };
        exec redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks:
      - cs2-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local

networks:
  cs2-network:
    driver: bridge
