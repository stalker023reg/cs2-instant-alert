[project]
name = "cs2-instant-alert"
version = "0.1.0"
description = "Production-grade Steam update monitoring with multi-channel critical notifications"
readme = "docs/README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CS2 Instant Alert Team" }]

dependencies = [
    # --- Core ---
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "greenlet>=3.1.0",

    # --- Cache ---
    "redis[hiredis]>=5.2.0,<6.0",

    # --- Telegram ---
    "python-telegram-bot[job-queue]>=21.9,<22.0",

    # --- Steam ---
    "steam[client]>=1.4.4,<2.0",

    # --- Notifications ---
    "httpx>=0.28.0,<1.0",
    "aiosmtplib>=3.0.0,<4.0",

    # --- Translation ---
    "deepl>=1.18.0,<2.0",

    # --- Scheduler ---
    "apscheduler>=3.10.0,<4.0",

    # --- Security ---
    "cryptography>=44.0.0,<45.0",

    # --- DI ---
    "dependency-injector>=4.43.0,<5.0",

    # --- Logging ---
    "structlog>=24.4.0,<26.0",

    # --- Utilities ---
    "python-dotenv>=1.0.0,<2.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "pytest-mock>=3.14.0,<4.0",
    "factory-boy>=3.3.0,<4.0",
    "httpx>=0.28.0,<1.0",
    "ruff>=0.8.0,<1.0",
    "black>=24.10.0,<26.0",
    "isort>=5.13.0,<6.0",
    "mypy>=1.13.0,<2.0",
    "pre-commit>=4.0.0,<5.0",
    "asyncpg-stubs>=0.30.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ─── Tool Configurations ───

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "ASYNC",# flake8-async
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for DI)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "steam.*",
    "dependency_injector.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require DB)",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
