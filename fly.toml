# ════════════════════════════════════════════════════════════════
# CS2 Instant Alert — Fly.io Configuration
# ════════════════════════════════════════════════════════════════

app = 'cs2-instant-alert'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_LOG_LEVEL = 'INFO'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = '45s'
  interval = '30s'
  method = 'GET'
  path = '/api/health'
  timeout = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[restart]]
  policy = 'always'
  processes = ['app']
